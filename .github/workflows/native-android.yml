name: Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/native-android-kotlin
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"

permissions:
  contents: write

concurrency:
  group: rss-liquid-flow-pro-native-android
  cancel-in-progress: false

jobs:
  build:
    name: Build native Kotlin Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate native game specification
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path("native-android/app/src/main/assets/game-spec.json").read_text())
          assert spec["schemaVersion"] == 1
          assert 2 <= spec["capacity"] <= 12
          colors = spec["colors"]
          ids = [item["id"] for item in colors]
          assert ids and len(ids) == len(set(ids))
          valid = set(ids)
          board = spec["defaultBoard"]
          assert len(board) >= 2
          assert all(len(tube) <= spec["capacity"] for tube in board)
          assert all(color_id in valid for tube in board for color_id in tube)
          for item in colors:
              assert len(item["hex"]) == 7 and item["hex"].startswith("#")
          print("Native game specification is valid.")
          PY

      - name: Run native unit tests
        run: gradle -p native-android :app:testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: gradle -p native-android :app:assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSS-Liquid-Flow-Pro-Native-Debug-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download test APK
        if: github.ref == 'refs/heads/feat/native-android-kotlin'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="native-test-latest"
          APK="native-android/app/build/outputs/apk/debug/app-debug.apk"
          NOTES="Installable RSS Liquid Flow Pro native Android test build. Debug-signed; for testing only, not production distribution."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#RSS Liquid Flow Pro APK" --clobber
          else
            gh release create "$TAG" "$APK#RSS Liquid Flow Pro APK" \
              --target "$GITHUB_SHA" --prerelease --title "RSS Liquid Flow Pro — Test APK" \
              --notes "$NOTES"
          fi
