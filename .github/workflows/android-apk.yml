name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "vite.config.ts"
      - "index.html"
      - "public/**"
      - "src/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: rss-liquid-flow-pro-android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build RSS Liquid Flow Pro APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install web and Capacitor dependencies
        run: |
          npm install --legacy-peer-deps --no-save --no-package-lock --no-audit --no-fund @capacitor/core@7.4.3 @capacitor/android@7.4.3 @capacitor/cli@7.4.3 @capacitor/assets@3.0.5

      - name: Build web application
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Generate RSS Liquid Flow app icon and splash screen
        run: |
          mkdir -p assets
          cp public/logo.png assets/logo.png
          npx capacitor-assets generate --android --iconBackgroundColor "#090b2b" --splashBackgroundColor "#090b2b" --logoSplashScale 0.3

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSS-Liquid-Flow-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=rss-liquid-flow-pro-latest
          REPO=${GITHUB_REPOSITORY}
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$REPO"
            gh release edit "$TAG" --title "RSS Liquid Flow Pro — Latest Android APK" --notes "Latest Android APK built from the main branch. This package contains the original Google AI Studio React/Vite game wrapped with Capacitor. Gameplay source is not rewritten for Android." --latest --repo "$REPO"
          else
            gh release create "$TAG" "$APK" --title "RSS Liquid Flow Pro — Latest Android APK" --notes "Latest Android APK built from the main branch. This package contains the original Google AI Studio React/Vite game wrapped with Capacitor. Gameplay source is not rewritten for Android." --latest --target "$GITHUB_SHA" --repo "$REPO"
          fi
