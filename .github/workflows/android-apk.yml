name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/boot-splash-and-rss-auth-flow
    paths:
      - "capacitor.config.json"
      - "vite.config.ts"
      - "index.html"
      - "public/**"
      - "src/**"
      - "native/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: rss-liquid-flow-pro-android-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build RSS Liquid Flow Pro signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install web and Capacitor dependencies
        run: |
          npm install --legacy-peer-deps --no-save --no-package-lock --no-audit --no-fund @capacitor/core@7.4.3 @capacitor/android@7.4.3 @capacitor/cli@7.4.3 @capacitor/assets@3.0.5

      - name: Build web application
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Configure native Android updater and signing
        run: node scripts/configure-android-updater.mjs

      - name: Generate RSS Liquid Flow app icon and splash screen
        run: |
          mkdir -p assets
          cp public/logo.png assets/logo.png
          npx capacitor-assets generate --android --iconBackgroundColor "#ffffff" --iconBackgroundColorDark "#ffffff" --splashBackgroundColor "#090b2b" --logoSplashScale 0.3
          test -s public/logo.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          find android/app/src/main/res -type f -iname '*splash*' -size +0c | grep -q .

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Prepare persistent Android signing keystore
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64" || { echo "Missing ANDROID_SIGNING_KEYSTORE_BASE64"; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/rss-android-signing"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rss-android-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/rss-android-signing/release.jks"
          test -s "$RUNNER_TEMP/rss-android-signing/release.jks"
          echo "RSS_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/rss-android-signing/release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          RSS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          RSS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          RSS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$RSS_ANDROID_STORE_PASSWORD" || { echo "Missing ANDROID_SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$RSS_ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_SIGNING_KEY_ALIAS"; exit 1; }
          test -n "$RSS_ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_SIGNING_KEY_PASSWORD"; exit 1; }
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature and package metadata
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs "$APK" >/dev/null
          keytool -printcert -jarfile "$APK" | grep -q "CN=Razeen Secure Solution"
          sha256sum "$APK"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSS-Liquid-Flow-Pro-Signed-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK and update metadata
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=rss-liquid-flow-pro-latest
          REPO=${GITHUB_REPOSITORY}
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION_CODE=${GITHUB_RUN_NUMBER}
          VERSION_NAME=1.0.${VERSION_CODE}
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          APK_URL="https://github.com/${REPO}/releases/download/${TAG}/app-release.apk"
          cat > update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${APK_URL}",
            "sha256": "${APK_SHA256}"
          }
          EOF
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "RSS Liquid Flow Pro — Latest Android APK" --notes "Latest signed Android APK. Android will request user confirmation for package installation." --latest --repo "$REPO"
          else
            gh release create "$TAG" --title "RSS Liquid Flow Pro — Latest Android APK" --notes "Latest signed Android APK. Android will request user confirmation for package installation." --latest --target "$GITHUB_SHA" --repo "$REPO"
          fi
          gh release upload "$TAG" "$APK" update.json --clobber --repo "$REPO"
