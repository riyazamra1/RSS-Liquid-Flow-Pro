name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "vite.config.ts"
      - "index.html"
      - "src/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: rss-liquid-flow-pro-android-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build RSS Liquid Flow Pro APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install web and Capacitor dependencies
        run: |
          npm install --legacy-peer-deps --no-save --no-package-lock --no-audit --no-fund @capacitor/core@7.4.3 @capacitor/android@7.4.3 @capacitor/cli@7.4.3

      - name: Build web application
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSS-Liquid-Flow-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
