name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "vite.config.ts"
      - "index.html"
      - "public/**"
      - "src/**"
      - "native/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: rss-liquid-flow-pro-android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build RSS Liquid Flow Pro APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install web and Capacitor dependencies
        run: |
          npm install --legacy-peer-deps --no-save --no-package-lock --no-audit --no-fund @capacitor/core@7.4.3 @capacitor/android@7.4.3 @capacitor/cli@7.4.3 @capacitor/assets@3.0.5

      - name: Build web application
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Configure native Android updater
        run: node scripts/configure-android-updater.mjs

      - name: Generate RSS Liquid Flow app icon and splash screen
        run: |
          mkdir -p assets
          cp public/logo.png assets/logo.png
          npx capacitor-assets generate --android --iconBackgroundColor "#ffffff" --iconBackgroundColorDark "#ffffff" --splashBackgroundColor "#090b2b" --logoSplashScale 0.3
          test -s public/logo.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          find android/app/src/main/res -type f -iname '*splash*' -size +0c | grep -q .

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSS-Liquid-Flow-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=rss-liquid-flow-pro-latest
          REPO=${GITHUB_REPOSITORY}
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          VERSION_CODE=${GITHUB_RUN_NUMBER}
          VERSION_NAME=1.0.${VERSION_CODE}
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          APK_URL="https://github.com/${REPO}/releases/download/${TAG}/app-debug.apk"
          cat > update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${APK_URL}",
            "sha256": "${APK_SHA256}"
          }
          EOF
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "RSS Liquid Flow Pro — Latest Android APK" --notes "Latest Android APK with native in-app update checks. Android will request user confirmation for package installation." --latest --repo "$REPO"
          else
            gh release create "$TAG" --title "RSS Liquid Flow Pro — Latest Android APK" --notes "Latest Android APK with native in-app update checks. Android will request user confirmation for package installation." --latest --target "$GITHUB_SHA" --repo "$REPO"
          fi
          gh release upload "$TAG" "$APK" update.json --clobber --repo "$REPO"
