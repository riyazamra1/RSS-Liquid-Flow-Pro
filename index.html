<!doctype html>
<html lang="en" data-theme="botanical">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RSS LIQUID FLOW</title>
    <meta name="description" content="Crystal glass liquid sorting puzzle game with a winding progression map, daily login streaks, and friend life sharing." />
    <meta name="theme-color" content="#090b2b" />
    <style>
      html, body { min-height: 100%; margin: 0; background: #090b2b; }
      #rss-boot-splash { position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #090b2b; color: #fff; font: 700 20px system-ui, sans-serif; letter-spacing: .08em; }
      #rss-boot-splash img { width: 144px; height: 144px; object-fit: contain; background: #fff; border-radius: 28px; padding: 14px; box-sizing: border-box; }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Liquid Flow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="RSS LIQUID FLOW" />
    <meta property="og:description" content="Play RSS LIQUID FLOW — sort vibrant liquids across crystal jars, race friends on the map, and claim daily streak rewards." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Telegram Mini App SDK (activates automatically when opened inside Telegram) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body class="antialiased">
    <div id="rss-boot-splash" role="status" aria-label="Loading RSS Liquid Flow">
      <img src="/logo.png" alt="RSS Liquid Flow" />
      <span>RSS LIQUID FLOW</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
